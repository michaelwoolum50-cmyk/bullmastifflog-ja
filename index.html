<h1>BullmastiffLog</h1>
<p>ブルマスティフ専用の記録アプリです。開発者: michaelwoolum</p>
<h2>できること</h2>
<ul>
<li>毎日の記録 — 体重、ごはん、通院をその日のうちに残す</li>
<li>血統の記録 — 父犬、母犬、犬舎、世代を一か所に整理する</li>
<li>トレーニングの記録 — うまくいったこと、いかなかったことを残し、数か月の変化を見る</li>
<li>記録は端末の中に置く、プライベートな設計です</li>
</ul>
